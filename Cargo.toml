[workspace]
resolver = "3"
members = ["bench", "crates/conformance", "crates/derivation", "crates/outputs", "crates/transport", "tools/repo-check"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/feltfomo/shikumi"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shikumi-derivation = { path = "crates/derivation" }
shikumi-outputs = { path = "crates/outputs" }
shikumi-transport = { path = "crates/transport" }
tempfile = "3.27"
# one runtime per process, as the core will run; only the parts the store transport uses.
tokio = { version = "1.54", default-features = false, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
